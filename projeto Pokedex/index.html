<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body>
    
    <main>   
        <!-- Imagem do Pokemon exibido -->
         <img src="#" alt="pokemon" class="imagem_pokemon" id="imagens">

         <!-- Exibição do número e nome do Pokemon-->
      
         <h1 class="dados_pokemon">
            <span class="numero_pokemon" id="numero"></span>
            <span class="nome_pokemon" id="nome"></span>
        </h1>

        <!-- Formulário de busca para procurar um pokemon por nome ou número-->
         <form action="#" class="formulario">
            <input type="search" class="campo_busca" placeholder="Nome ou Número" required>
         </form>

         <!-- Botões para navegar entre os pokemons -->
          <div class="botoes">
            <button class="botao botao_anterior"> &lt; Anterior</button>
            <button class="botao botao_proximo">Próximo &gt;</button>
        </div>

        <!-- Imagem da pokedex -->
         <img src="assets/images/pokedex.png" alt="pokedex" class="pokedex">
    </main>
    <script src="./assets/js/script.js"></script>
</body>
</html>
